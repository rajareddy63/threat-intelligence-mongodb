services:
  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_DATABASE: threatintel
    ports:
      - "27118:27017"
    volumes:
      - mongo_data:/data/db
      - ./init/mongo-init.js:/docker-entrypoint-initdb.d/10-threatintel.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  cassandra:
    image: cassandra:4.1
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    ports:
      - "29042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/exercise18password
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "27474:7474"
      - "27687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p exercise18password 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 45s

  app:
    image: mongodb-exercise18:local
    build: .
    environment:
      MONGO_URI: mongodb://mongodb:27017
      CASSANDRA_HOSTS: cassandra
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: exercise18password
      THREAT_RECORDS: ${THREAT_RECORDS:-100000}
      THREAT_SEED: ${THREAT_SEED:-19}
    depends_on:
      mongodb:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: ["python", "run_all.py", "--records", "${THREAT_RECORDS:-100000}", "--runs", "10", "--seed", "${THREAT_SEED:-19}"]
    volumes:
      - ./results:/app/results

volumes:
  mongo_data:
  cassandra_data:
  neo4j_data:
