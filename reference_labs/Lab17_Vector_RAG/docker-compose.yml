services:
  rag:
    build: .
    image: ${DOCKER_IMAGE:-yourusername/mongodb-rag-lab17:latest}
    environment:
      MONGODB_URI: ${MONGODB_URI:-${MONGO_URI:-}}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-rag_demo}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_MODEL: ${VOYAGE_MODEL:-voyage-3-lite}
      SENTENCE_TRANSFORMER_MODEL: ${SENTENCE_TRANSFORMER_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    command: ["python", "lab17_1_rag.py"]

  benchmark:
    build: .
    image: ${DOCKER_IMAGE:-yourusername/mongodb-rag-lab17:latest}
    profiles: ["benchmark"]
    environment:
      MONGODB_URI: ${MONGODB_URI:-${MONGO_URI:-}}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-rag_demo}
      SENTENCE_TRANSFORMER_MODEL: ${SENTENCE_TRANSFORMER_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    command: ["python", "lab17_2_benchmark.py"]
