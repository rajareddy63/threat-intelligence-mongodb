# MongoDB replica set "rs0". Every container listens on 27017 INSIDE Docker and the
# members reach each other by container name. Docker publishes them on
# localhost:28017, 28018 and 28019 for the Python scripts.
services:
  mongo-rs0-1:
    image: mongo:7
    container_name: mongo-rs0-1
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports: ["28017:27017"]
    volumes: ["rs0_data1:/data/db"]

  mongo-rs0-2:
    image: mongo:7
    container_name: mongo-rs0-2
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports: ["28018:27017"]
    volumes: ["rs0_data2:/data/db"]

  mongo-rs0-3:
    image: mongo:7
    container_name: mongo-rs0-3
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports: ["28019:27017"]
    volumes: ["rs0_data3:/data/db"]

volumes:
  rs0_data1:
  rs0_data2:
  rs0_data3:
