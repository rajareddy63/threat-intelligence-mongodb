services:
  mongo:
    image: mongo:7.0
    container_name: mongo-ex16
    restart: unless-stopped
    command: ["--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "27017:27017"

  cassandra:
    image: cassandra:5.0
    container_name: cassandra-ex16
    restart: unless-stopped
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 25s
    ports:
      - "9042:9042"

  neo4j:
    image: neo4j:5.20
    container_name: neo4j-ex16
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/LocalPass123
      NEO4J_dbms_memory_pagecache_size: 256M
      NEO4J_dbms_memory_heap_initial__size: 256M
      NEO4J_dbms_memory_heap_max__size: 512M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    ports:
      - "7474:7474"
      - "7687:7687"

  hybrid-service:
    image: mongodb-exercise16:latest
    container_name: hybrid-service-ex16
    depends_on:
      mongo:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: fraud
      CASSANDRA_CONTACT_POINTS: cassandra
      CASSANDRA_KEYSPACE: user_activity
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: LocalPass123
    command: ["python", "/app/lab16.2-hybrid-service/demo_runner.py"]

volumes:
  mongo_data:
  cassandra_data:
  neo4j_data:
  neo4j_logs:
