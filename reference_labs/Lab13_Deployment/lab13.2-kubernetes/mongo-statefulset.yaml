apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
spec:
  serviceName: mongo
  replicas: 3
  selector:
    matchLabels:
      app: mongo
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        app: mongo
    spec:
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: install-keyfile
          image: busybox:1.36
          command:
            - sh
            - -ec
            - |
              cp /key-source/keyfile /key-work/keyfile
              chown 999:999 /key-work/keyfile
              chmod 0400 /key-work/keyfile
              test "$(stat -c '%a:%u' /key-work/keyfile)" = "400:999"
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - name: mongo-keyfile-source
              mountPath: /key-source
              readOnly: true
            - name: mongo-keyfile
              mountPath: /key-work
      containers:
        - name: mongod
          image: mongo:7.0
          args:
            - mongod
            - --replSet
            - rs0
            - --bind_ip_all
            - --auth
            - --keyFile
            - /etc/mongo-keyfile/keyfile
          ports:
            - name: mongo
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-auth
                  key: username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-auth
                  key: password
          startupProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
            - name: mongo-keyfile
              mountPath: /etc/mongo-keyfile
              readOnly: true
      volumes:
        - name: mongo-keyfile-source
          secret:
            secretName: mongo-keyfile
            defaultMode: 0400
        - name: mongo-keyfile
          emptyDir:
            medium: Memory
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
