services:
  mongo:
    image: mongo:7.0
    container_name: threatintel-mongo
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27127:27017"
    volumes:
      - threatintel_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    image: threat-intelligence-mongodb:1.0
    container_name: threatintel-backend
    restart: unless-stopped
    command: ["uvicorn","app.main:app","--host","0.0.0.0","--port","8000"]
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: threat_intelligence
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:3b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      KNOWLEDGE_DIR: /app/reference_labs
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5

  frontend:
    image: threat-intelligence-mongodb:1.0
    container_name: threatintel-frontend
    restart: unless-stopped
    command: ["streamlit","run","app/streamlit_app.py","--server.address","0.0.0.0","--server.port","8501"]
    environment:
      API_URL: http://backend:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      backend:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.3
    container_name: threatintel-prometheus
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend

volumes:
  threatintel_data:
